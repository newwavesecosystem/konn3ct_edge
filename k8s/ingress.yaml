apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conn3ct-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Ensure WebSockets don't timeout during long meetings
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    
    # ---------------------------------------------------------
    # OPTION A: STICKY SESSIONS BY ROOM ID
    # This guarantees that all users trying to connect to 
    # ?roomId=xyz will always be routed to the EXACT same pod.
    # ---------------------------------------------------------
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_roomId"
    
    # Force SSL redirect if you configure cert-manager later
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  rules:
  - host: konn3ctedge.konn3ct.net # Change to your actual domain
    http:
      paths:
      - path: /signal
        pathType: Prefix
        backend:
          service:
            name: conn3ct-backend-service
            port:
              number: 80
