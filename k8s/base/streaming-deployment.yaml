apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-streaming-worker
  labels:
    app: conn3ct-streaming-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: conn3ct-streaming-worker
  template:
    metadata:
      labels:
        app: conn3ct-streaming-worker
    spec:
      containers:
        - name: streaming-worker
          image: registry.digitalocean.com/konn3ct-registry/conn3ct-streaming-worker:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: conn3ct-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
