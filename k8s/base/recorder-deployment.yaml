apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-recorder
  labels:
    app: conn3ct-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conn3ct-recorder
  template:
    metadata:
      labels:
        app: conn3ct-recorder
    spec:
      containers:
        - name: recorder
          image: registry.digitalocean.com/konn3ct-registry/conn3ct-recorder
          imagePullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "5.0Gi"
              cpu: "2500m"
          envFrom:
            - secretRef:
                name: conn3ct-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: BACKEND_URL
              value: "http://conn3ct-backend-service:80"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
