apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-backend
  labels:
    app: conn3ct-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: conn3ct-backend
  template:
    metadata:
      labels:
        app: conn3ct-backend
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: backend
          image: registry.digitalocean.com/konn3ct-registry/conn3ct-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
            # UDP ports do not strictly need declaring if hostNetwork=true, but good for docs
            - containerPort: 10000
              name: webrtc-udp
              protocol: UDP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: WEBRTC_LISTEN_IP
              value: "0.0.0.0"
            - name: WEBRTC_ANNOUNCED_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Load secrets from K8s Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: GEMINI_API_KEY
            - name: EXTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: EXTERNAL_API_KEY
            - name: PAYSTACK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: PAYSTACK_SECRET_KEY
            - name: DO_SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_ENDPOINT
            - name: DO_SPACES_REGION
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_REGION
            - name: DO_SPACES_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_KEY
            - name: DO_SPACES_SECRET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_SECRET
            - name: DO_SPACES_BUCKET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_BUCKET
            - name: NEXT_PUBLIC_FRONTEND_URL
              value: "https://edge.konn3ct.net"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MAX_DEGRADATION_CPU_LOAD
              value: "85"
            - name: MAX_ACTIVE_CAMERAS
              value: "15"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: OPENAI_API_KEY
            - name: PAYSTACK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: PAYSTACK_SECRET_KEY
            - name: TURN_DOMAIN
              value: "turnedge.konn3ct.net"
            - name: TURN_SECRET
              value: "my-super-strong-conn3ct-secret-123"
          resources:
            requests:
              cpu: "1500m"
              memory: "2Gi"
            limits:
              cpu: "3500m"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
