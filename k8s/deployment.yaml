apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-backend
  labels:
    app: conn3ct-backend
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: conn3ct-backend
  template:
    metadata:
      labels:
        app: conn3ct-backend
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: backend
          image: registry.digitalocean.com/konn3ct-registry/conn3ct-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
            # UDP ports do not strictly need declaring if hostNetwork=true, but good for docs
            - containerPort: 10000
              name: webrtc-udp
              protocol: UDP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: WEBRTC_LISTEN_IP
              value: "0.0.0.0"
            - name: WEBRTC_ANNOUNCED_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Load secrets from K8s Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: GEMINI_API_KEY
            - name: PAYSTACK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: PAYSTACK_SECRET_KEY
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
