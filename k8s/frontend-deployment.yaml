apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-frontend
  labels:
    app: conn3ct-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conn3ct-frontend
  template:
    metadata:
      labels:
        app: conn3ct-frontend
    spec:
      containers:
        - name: frontend
          image: registry.digitalocean.com/konn3ct-registry/conn3ct-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_BACKEND_DOMAIN
              value: "konn3ctedge.konn3ct.net"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
