apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-frontend
  labels:
    app: conn3ct-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: conn3ct-frontend
  template:
    metadata:
      labels:
        app: conn3ct-frontend
    spec:
      containers:
        - name: frontend
          image: registry.digitalocean.com/konn3ct-registry/conn3ct-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_BACKEND_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: NEXT_PUBLIC_BACKEND_DOMAIN
            - name: BACKEND_URL
              value: "http://conn3ct-backend-service"
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: DO_SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_ENDPOINT
            - name: DO_SPACES_REGION
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_REGION
            - name: DO_SPACES_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_KEY
            - name: DO_SPACES_SECRET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_SECRET
            - name: DO_SPACES_BUCKET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: DO_SPACES_BUCKET
            - name: MAX_REJECTION_CPU_LOAD
              value: "90"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: OPENAI_API_KEY
            - name: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
            - name: BOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: BOT_SECRET
            - name: NEXT_PUBLIC_MEETING_ONLY_MODE
              valueFrom:
                secretKeyRef:
                  name: conn3ct-secrets
                  key: NEXT_PUBLIC_MEETING_ONLY_MODE
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
