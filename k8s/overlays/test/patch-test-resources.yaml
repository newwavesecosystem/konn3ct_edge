apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-signaling
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-media
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2.5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-recorder
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: recorder
          env:
            - name: MAX_CONCURRENT_BROWSERS
              value: "2"
            - name: MAX_CONCURRENT_TRANSCODES
              value: "2"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2.5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
