apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-signaling
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-media
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "6000m"
              memory: "12Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-recorder
spec:
  template:
    spec:
      nodeSelector:
        role: recorder
      containers:
        - name: recorder
          env:
            - name: MAX_CONCURRENT_BROWSERS
              value: "20"
            - name: MAX_CONCURRENT_TRANSCODES
              value: "20"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "28000m"
              memory: "28Gi"
