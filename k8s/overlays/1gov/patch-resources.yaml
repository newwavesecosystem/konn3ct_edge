apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-signaling
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu20
      hostAliases:
        - ip: "197.159.74.14"
          hostnames:
            - "meetingapp2.1gov.ng"
            - "meetingapi.1gov.ng"
            - "meetingstorage.1gov.ng"
      containers:
        - name: backend
          env:
            - name: PUBLIC_STORAGE_URL
              value: "https://meetingstorage.1gov.ng"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-media
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu20
      containers:
        - name: backend
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "6000m"
              memory: "12Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-recorder
spec:
  template:
    spec:
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        role: recorder
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "recorder"
          effect: "NoSchedule"
      hostAliases:
        - ip: "197.159.74.14"
          hostnames:
            - "meetingapp2.1gov.ng"
            - "meetingapi.1gov.ng"
            - "meetingstorage.1gov.ng"
      containers:
        - name: recorder
          env:
            - name: DO_SPACES_ENDPOINT
              value: "http://minio-service:9000"
            - name: PUBLIC_STORAGE_URL
              value: "https://meetingstorage.1gov.ng"
            - name: MAX_CONCURRENT_BROWSERS
              value: "20"
            - name: MAX_CONCURRENT_TRANSCODES
              value: "3"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "28000m"
              memory: "28Gi"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu20
      containers:
        - name: redis
          args: [
            "--maxmemory", "3000mb",
            "--maxmemory-policy", "allkeys-lru",
            "--appendonly", "yes",
            "--appendfsync", "everysec",
            "--dir", "/data"
          ]
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: redis-storage
          hostPath:
            path: /var/lib/redis-data
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu20
