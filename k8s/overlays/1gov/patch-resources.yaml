apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-signaling
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu20
      hostAliases:
        - ip: "197.159.74.14"
          hostnames:
            - "meetingapp2.1gov.ng"
            - "meetingapi.1gov.ng"
            - "meetingstorage.1gov.ng"
      containers:
        - name: backend
          env:
            - name: DO_SPACES_ENDPOINT
              value: "http://minio-service:9000"
            - name: PUBLIC_STORAGE_URL
              value: "https://meetingstorage.1gov.ng"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-media
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu20
      containers:
        - name: backend
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "6000m"
              memory: "12Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-recorder
spec:
  template:
    spec:
      nodeSelector:
        role: recorder
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "recorder"
          effect: "NoSchedule"
      hostAliases:
        - ip: "197.159.74.14"
          hostnames:
            - "meetingapp2.1gov.ng"
            - "meetingapi.1gov.ng"
            - "meetingstorage.1gov.ng"
      containers:
        - name: recorder
          env:
            - name: DO_SPACES_ENDPOINT
              value: "http://minio-service:9000"
            - name: PUBLIC_STORAGE_URL
              value: "https://meetingstorage.1gov.ng"
            - name: MAX_CONCURRENT_BROWSERS
              value: "20"
            - name: MAX_CONCURRENT_TRANSCODES
              value: "20"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "28000m"
              memory: "28Gi"
