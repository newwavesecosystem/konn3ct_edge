apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - cluster-issuer.yaml
  - postgres.yaml
  - minio.yaml

patchesStrategicMerge:
  - patch-ingress.yaml
  - patch-resources.yaml

images:
  - name: registry.digitalocean.com/konn3ct-registry/conn3ct-frontend
    newTag: 1gov_stag
  - name: registry.digitalocean.com/konn3ct-registry/conn3ct-backend
    newTag: prod-latest
  - name: registry.digitalocean.com/konn3ct-registry/conn3ct-recorder
    newTag: prod-latest
