apiVersion: apps/v1
kind: Deployment
metadata:
  name: conn3ct-recorder
  labels:
    app: conn3ct-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conn3ct-recorder
  template:
    metadata:
      labels:
        app: conn3ct-recorder
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - conn3ct-backend
            topologyKey: kubernetes.io/hostname
      containers:
      - name: recorder
        image: registry.digitalocean.com/konn3ct-registry/conn3ct-recorder:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        envFrom:
        - secretRef:
            name: conn3ct-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: BACKEND_URL
          value: "http://conn3ct-backend-service:80"
