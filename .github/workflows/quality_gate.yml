name: DevSecOps Quality Gate

on:
  pull_request:
    branches: [ main, prod, 1gov_stag ]
  push:
    branches: [ main, prod, 1gov_stag ]

jobs:
  quality-gate:
    name: Enforce Quality & Security
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konn3ct_test
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for accurate secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting (Code Quality)
        run: npm run lint

      - name: Unit & Integration Tests (with Typechecking)
        run: npm run test:unit
        env:
          # Required dummy env vars so Prisma and Tests don't instantly crash
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/konn3ct_test"
          JWT_SECRET: "test_secret"
          REDIS_URL: "redis://localhost:6379"
          OPENAI_API_KEY: "dummy_key"

      - name: Dependency Vulnerability Audit (SCA)
        run: npm audit --audit-level=critical


      - name: Post Evidence to Odoo
        if: always()
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USER: ${{ vars.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          node scripts/odoo_integration.js \
            --action post_evidence \
            --branch-name "${{ github.ref_name }}" \
            --build-status "${{ job.status }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}"
            
      - name: Automated Defect Creation
        if: failure()
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USER: ${{ vars.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          node scripts/odoo_integration.js \
            --action create_defect \
            --branch-name "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}" \
            --author "${{ github.actor }}"
