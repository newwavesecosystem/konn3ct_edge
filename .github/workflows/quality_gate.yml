name: DevSecOps Quality Gate

on:
  pull_request:
    branches: [ main, prod, 1gov_stag ]
  push:
    branches: [ main, prod, 1gov_stag ]

jobs:
  quality-gate:
    name: Enforce Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for accurate secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting (Code Quality)
        run: npm run lint

      - name: Unit & Integration Tests (with Typechecking)
        run: npm run quality:gate
        env:
          # Required dummy env vars so Prisma and Tests don't instantly crash
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/konn3ct_test"
          JWT_SECRET: "test_secret"

      - name: Dependency Vulnerability Audit (SCA)
        run: npm audit --audit-level=high

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
