name: Build and Deploy to DigitalOcean Kubernetes

on:
  push:
    branches:
      - main
      - prod
      - 1gov_stag

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/1gov_stag' && '1gov_stag' || (github.ref == 'refs/heads/main' && 'staging' || 'production') }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install DigitalOcean doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: docker login registry.digitalocean.com -u ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} -p ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and Push Backend Docker Image
        if: github.ref != 'refs/heads/1gov_stag'
        run: |
          IMAGE_NAME="registry.digitalocean.com/konn3ct-registry/conn3ct-backend"
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:${{ github.sha }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:staging-latest
            docker push $IMAGE_NAME:staging-latest
          elif [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:prod-latest
            docker push $IMAGE_NAME:prod-latest
          fi

      - name: Build and Push Frontend Docker Image
        run: |
          IMAGE_NAME="registry.digitalocean.com/konn3ct-registry/conn3ct-frontend"
          docker build \
            --build-arg NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }} \
            --build-arg NEXT_PUBLIC_BACKEND_DOMAIN=${{ secrets.NEXT_PUBLIC_BACKEND_DOMAIN }} \
            --build-arg NEXT_PUBLIC_APP_NAME="${{ secrets.NEXT_PUBLIC_APP_NAME }}" \
            --build-arg NEXT_PUBLIC_MEETING_ONLY_MODE="${{ secrets.NEXT_PUBLIC_MEETING_ONLY_MODE }}" \
            --build-arg NEXT_PUBLIC_QA_DIAGNOSTICS="${{ secrets.NEXT_PUBLIC_QA_DIAGNOSTICS }}" \
            --build-arg NEXT_PUBLIC_POOR_NETWORK_RTT="${{ secrets.NEXT_PUBLIC_POOR_NETWORK_RTT }}" \
            --build-arg NEXT_PUBLIC_POOR_NETWORK_LOSS="${{ secrets.NEXT_PUBLIC_POOR_NETWORK_LOSS }}" \
            --build-arg NEXT_PUBLIC_POOR_NETWORK_JITTER="${{ secrets.NEXT_PUBLIC_POOR_NETWORK_JITTER }}" \
            --build-arg NEXT_PUBLIC_UNSTABLE_NETWORK_RTT="${{ secrets.NEXT_PUBLIC_UNSTABLE_NETWORK_RTT }}" \
            --build-arg NEXT_PUBLIC_UNSTABLE_NETWORK_LOSS="${{ secrets.NEXT_PUBLIC_UNSTABLE_NETWORK_LOSS }}" \
            --build-arg NEXT_PUBLIC_UNSTABLE_NETWORK_JITTER="${{ secrets.NEXT_PUBLIC_UNSTABLE_NETWORK_JITTER }}" \
            --build-arg NEXT_PUBLIC_NETWORK_WINDOW_SIZE="${{ secrets.NEXT_PUBLIC_NETWORK_WINDOW_SIZE }}" \
            --build-arg NEXT_PUBLIC_NETWORK_MONITOR_INTERVAL="${{ secrets.NEXT_PUBLIC_NETWORK_MONITOR_INTERVAL }}" \
            --build-arg NEXT_PUBLIC_HIDE_SIGNUP_BUTTON="${{ vars.NEXT_PUBLIC_HIDE_SIGNUP_BUTTON }}" \
            --build-arg NEXT_PUBLIC_MAX_AUDIO_SLOTS="${{ vars.NEXT_PUBLIC_MAX_AUDIO_SLOTS }}" \
            --build-arg NEXT_PUBLIC_KONN3CT_EXTERNAL_API_URL="${{ vars.NEXT_PUBLIC_KONN3CT_EXTERNAL_API_URL }}" \
            --build-arg NEXT_PUBLIC_SIGNIN_URL="${{ vars.NEXT_PUBLIC_SIGNIN_URL }}" \
            -t $IMAGE_NAME:${{ github.sha }} ./frontend
          docker push $IMAGE_NAME:${{ github.sha }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:staging-latest
            docker push $IMAGE_NAME:staging-latest
          elif [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:prod-latest
            docker push $IMAGE_NAME:prod-latest
          elif [ "${{ github.ref }}" = "refs/heads/1gov_stag" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:1gov_stag
            docker push $IMAGE_NAME:1gov_stag
          fi

      - name: Build and Push Recorder Docker Image
        if: github.ref != 'refs/heads/1gov_stag'
        run: |
          IMAGE_NAME="registry.digitalocean.com/konn3ct-registry/conn3ct-recorder"
          docker build -t $IMAGE_NAME:${{ github.sha }} ./recorder
          docker push $IMAGE_NAME:${{ github.sha }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:staging-latest
            docker push $IMAGE_NAME:staging-latest
          fi

      # - name: Build and Push Streaming Worker Docker Image
      #   run: |
      #     IMAGE_NAME="registry.digitalocean.com/konn3ct-registry/conn3ct-streaming-worker"
      #     docker build -t $IMAGE_NAME:${{ github.sha }} ./streaming-worker
      #     docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
      #     docker push $IMAGE_NAME:${{ github.sha }}
      #     docker push $IMAGE_NAME:latest

      - name: Authenticate with Kubernetes Cluster
        if: github.ref != 'refs/heads/1gov_stag'
        run: |
          # The cluster name is now pulled from the environment-specific secrets
          doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Deploy Manifests to Kubernetes
        if: github.ref != 'refs/heads/1gov_stag'
        run: |
          # Inject dynamic backend domain into base ingress manifest
          sed -i "s/__NEXT_PUBLIC_BACKEND_DOMAIN__/${{ secrets.NEXT_PUBLIC_BACKEND_DOMAIN }}/g" k8s/base/ingress.yaml
          
          # Safely inject GitHub Secrets into a Kubernetes Secret called 'conn3ct-secrets'
          kubectl create secret generic conn3ct-secrets \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --from-literal=DEEPGRAM_API_KEY="${{ secrets.DEEPGRAM_API_KEY }}" \
            --from-literal=ODOO_URL="${{ vars.ODOO_URL }}" \
            --from-literal=ODOO_DB="${{ vars.ODOO_DB }}" \
            --from-literal=ODOO_USER="${{ vars.ODOO_USER }}" \
            --from-literal=ODOO_API_KEY="${{ secrets.ODOO_API_KEY }}" \
            --from-literal=EXTERNAL_API_KEY="${{ secrets.EXTERNAL_API_KEY }}" \
            --from-literal=BOT_SECRET="${{ secrets.BOT_SECRET }}" \
            --from-literal=NEXT_PUBLIC_BACKEND_DOMAIN="${{ secrets.NEXT_PUBLIC_BACKEND_DOMAIN }}" \
            --from-literal=NEXT_PUBLIC_FRONTEND_DOMAIN="${{ secrets.NEXT_PUBLIC_FRONTEND_DOMAIN }}" \
            --from-literal=NEXT_PUBLIC_FRONTEND_URL="${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}" \
            --from-literal=NEXT_PUBLIC_APP_NAME="${{ secrets.NEXT_PUBLIC_APP_NAME }}" \
            --from-literal=NEXT_PUBLIC_KONN3CT_EXTERNAL_API_URL="${{ vars.NEXT_PUBLIC_KONN3CT_EXTERNAL_API_URL }}" \
            --from-literal=NEXT_PUBLIC_SIGNIN_URL="${{ vars.NEXT_PUBLIC_SIGNIN_URL }}" \
            --from-literal=PAYSTACK_SECRET_KEY="${{ secrets.PAYSTACK_SECRET_KEY }}" \
            --from-literal=NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}" \
            --from-literal=DO_SPACES_ENDPOINT="${{ secrets.DO_SPACES_ENDPOINT }}" \
            --from-literal=DO_SPACES_REGION="${{ secrets.DO_SPACES_REGION }}" \
            --from-literal=DO_SPACES_KEY="${{ secrets.DO_SPACES_KEY }}" \
            --from-literal=DO_SPACES_SECRET="${{ secrets.DO_SPACES_SECRET }}" \
            --from-literal=DO_SPACES_BUCKET="${{ vars.DO_SPACES_BUCKET }}" \
            --from-literal=S3_FORCE_PATH_STYLE="${{ vars.S3_FORCE_PATH_STYLE }}" \
            --from-literal=TELEMETRY_S3_BUCKET_NAME="${{ vars.TELEMETRY_S3_BUCKET_NAME }}" \
            --from-literal=NEXT_PUBLIC_MEETING_ONLY_MODE="${{ secrets.NEXT_PUBLIC_MEETING_ONLY_MODE }}" \
            --from-literal=NEXT_PUBLIC_QA_DIAGNOSTICS="${{ secrets.NEXT_PUBLIC_QA_DIAGNOSTICS }}" \
            --from-literal=NEXT_PUBLIC_MAX_AUDIO_SLOTS="${{ vars.NEXT_PUBLIC_MAX_AUDIO_SLOTS }}" \
            --from-literal=MAX_CONCURRENT_BROWSERS="${{ vars.MAX_CONCURRENT_BROWSERS || '5' }}" \
            --from-literal=MAX_CONCURRENT_TRANSCODES="${{ vars.MAX_CONCURRENT_TRANSCODES || '5' }}" \
            --dry-run=client -o yaml | kubectl apply -f -
            
          # Apply the appropriate Kustomize overlay based on branch/environment
          if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            echo "Applying Production Overlay (prod-latest)..."
            kubectl apply -k k8s/overlays/prod
          else
            echo "Applying Test/Staging Overlay (staging-latest)..."
            kubectl apply -k k8s/overlays/test
          fi
          
          # Gracefully rollout restart deployments so newly pushed images are pulled immediately
          kubectl rollout restart deployment conn3ct-signaling
          kubectl rollout restart deployment conn3ct-media
          kubectl rollout restart deployment conn3ct-frontend
          kubectl rollout restart deployment conn3ct-recorder

      - name: Setup Node.js for Odoo Integration
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post Evidence to Odoo
        if: always()
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USER: ${{ vars.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          node scripts/odoo_integration.js \
            --action post_evidence \
            --branch-name "${{ github.head_ref || github.ref_name }}" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --build-status "${{ job.status }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}" \
            --success-stage "Completed"
            
      - name: Automated Defect Creation
        if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod')
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USER: ${{ vars.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          node scripts/odoo_integration.js \
            --action create_defect \
            --branch-name "${{ github.head_ref || github.ref_name }}" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}" \
            --author "${{ github.actor }}"
