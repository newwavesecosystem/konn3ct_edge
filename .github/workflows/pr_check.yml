name: Traceability Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify_odoo_id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Odoo Traceability ID
        run: node scripts/odoo_integration.js --action verify_pr --pr-title "${{ github.event.pull_request.title }}" --branch-name "${{ github.head_ref }}"
